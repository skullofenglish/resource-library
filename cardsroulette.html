<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B1/B2 English Grammar & Speaking Practice</title>
    <!-- Google Fonts: Cinzel Decorative -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --dark-purple: #502064;
            --burgundy: #6B0F1A;
            --charcoal: #1A1A1A;
            --lavender: #6B3A7E;
            --light-lavender: #D8B4D9;
            --pink-accent: #F48FB1;
            --bg-light: #FDF8FE;
            --white: #FFFFFF;
        }

        body {
            font-family: 'Century Gothic', CenturyGothic, AppleGothic, sans-serif;
            background-color: var(--bg-light);
            color: var(--charcoal);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 15px;
        }

        h1 {
            font-family: 'Cinzel Decorative', serif;
            font-size: 2.2rem;
            color: var(--lavender);
            margin-bottom: 5px;
        }

        p.subtitle {
            font-style: italic;
            color: var(--burgundy);
            font-size: 0.95rem;
            margin-top: 0;
        }

        /* Controls Panel */
        .controls-panel {
            background: var(--white);
            border: 2px solid var(--light-lavender);
            border-radius: 12px;
            padding: 15px 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            box-shadow: 0 4px 12px rgba(80, 32, 100, 0.08);
            max-width: 900px;
            width: 100%;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--dark-purple);
        }

        select {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--light-lavender);
            font-family: 'Century Gothic', sans-serif;
            background: var(--bg-light);
            color: var(--charcoal);
            outline: none;
            cursor: pointer;
        }

        /* Start Button */
        .start-btn {
            background-color: var(--dark-purple);
            color: var(--white);
            border: none;
            padding: 12px 32px;
            font-size: 1.1rem;
            font-family: 'Cinzel Decorative', serif;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(80, 32, 100, 0.3);
        }

        .start-btn:hover {
            background-color: var(--burgundy);
            transform: translateY(-2px);
        }

        .start-btn:disabled {
            background-color: #aaa;
            cursor: not-allowed;
            transform: none;
        }

        /* Timer Display */
        .timer-container {
            background: var(--dark-purple);
            color: var(--white);
            border: 3px solid var(--pink-accent);
            border-radius: 50px;
            padding: 10px 25px;
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(107, 15, 26, 0.2);
            display: none;
            align-items: center;
            gap: 10px;
        }

        .timer-container.warning {
            background: var(--burgundy);
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        /* Cards Grid */
        .cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1000px;
            width: 100%;
            margin-bottom: 30px;
        }

        .card {
            background: var(--white);
            border-radius: 12px;
            border-left: 6px solid var(--lavender);
            box-shadow: 0 4px 15px rgba(80, 32, 100, 0.08);
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 150px;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .card.spinning {
            border-left-color: var(--pink-accent);
            background: #FAF3FA;
        }

        .card-category {
            font-family: 'Cinzel Decorative', serif;
            font-size: 0.85rem;
            color: var(--burgundy);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .card-content {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--dark-purple);
            margin-bottom: 12px;
            line-height: 1.3;
        }

        .card-hint {
            font-size: 0.85rem;
            color: #555;
            background: var(--bg-light);
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px dashed var(--light-lavender);
        }

        #db-status {
            font-size: 0.8rem;
            color: var(--dark-purple);
            margin-top: auto;
            padding: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>Grammar & Speaking Roulette</h1>
        <p class="subtitle">B1/B2 Practice: Tense Review, Functional Expressions & Topics</p>
    </header>

    <!-- Controls Panel -->
    <div class="controls-panel">
        <div class="control-group">
            <label for="difficulty">Game Mode / Cards</label>
            <select id="difficulty">
                <option value="easy">Easy (3 Cards)</option>
                <option value="medium" selected>Medium (4 Cards)</option>
                <option value="hard">Master Challenge (5 Cards)</option>
            </select>
        </div>

        <div class="control-group">
            <label for="modal-filter">Modal Focus</label>
            <select id="modal-filter">
                <option value="none" selected>None (No Modals)</option>
                <option value="all">All Modal Groups (Random)</option>
                <option value="ability">Ability & Possibility</option>
                <option value="permission">Permission & Requests</option>
                <option value="obligation">Obligation & Necessity</option>
                <option value="prohibition">Prohibition & Lack of Obligation</option>
                <option value="advice">Advice & Recommendation</option>
                <option value="deduction">Deduction & Certainty</option>
            </select>
        </div>

        <div class="control-group">
            <label for="timer-setting">Response Timer</label>
            <select id="timer-setting">
                <option value="30">30 Seconds</option>
                <option value="45">45 Seconds</option>
                <option value="60" selected>60 Seconds</option>
                <option value="90">90 Seconds</option>
                <option value="off">No Timer</option>
            </select>
        </div>

        <div style="display: flex; align-items: flex-end;">
            <button class="start-btn" id="start-btn" onclick="startRoulette()">Start / Shuffle</button>
        </div>
    </div>

    <!-- Timer Container -->
    <div class="timer-container" id="timer-box">
        ⏱️ <span id="timer-text">Time Remaining: 60s</span>
    </div>

    <!-- Cards Container -->
    <div class="cards-container" id="game-board">
        <div class="card" style="grid-column: 1 / -1; text-align: center; color: #777;">
            Click <strong>"Start / Shuffle"</strong> to spin the grammar roulette!
        </div>
    </div>

    <div id="db-status">Connecting to Firestore...</div>

    <!-- Firebase SDK Modular -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC2pSwDBIREaPmpOvainZzWGuuCEupxp1c",
            authDomain: "studenttrackerpanel.firebaseapp.com",
            projectId: "studenttrackerpanel",
            storageBucket: "studenttrackerpanel.firebasestorage.app",
            messagingSenderId: "1004678184015",
            appId: "1:1004678184015:web:be95625c08d8ee73ffe3a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        document.getElementById('db-status').innerText = "✓ Connected to Firestore successfully!";
        window.dbRef = db;
        window.addDoc = addDoc;
        window.collection = collection;
        window.serverTimestamp = serverTimestamp;
    </script>

    <script>
        // Dataset
        const dataPool = {
            // VERB TENSES REVIEW (RESTRITO AO PEDIDO)
            tenses: [
                { title: "Verb Tense", content: "Present Simple", hint: "Express a general truth, habit, daily routine, or personal fact." },
                { title: "Verb Tense", content: "Present Continuous", hint: "Describe an action happening right now or a current temporary situation." },
                { title: "Verb Tense", content: "Past Simple", hint: "Talk about a completed past event at a specific time in the past." },
                { title: "Verb Tense", content: "Past Continuous", hint: "Describe an ongoing action that was in progress in the past." },
                { title: "Verb Tense", content: "Present Perfect", hint: "Share a life experience up to now or something that started in the past and continues." },
                { title: "Verb Tense", content: "Used to", hint: "Talk about a past habit or routine that you no longer do today." },
                { title: "Verb Tense", content: "Future: Will Simple", hint: "Make a prediction, a spontaneous offer, or a promise about the future." },
                { title: "Verb Tense", content: "Future: Going to Simple", hint: "Discuss a future plan, intention, or something you've already decided to do." }
            ],

            // FUNCTIONAL EXPRESSIONS (OPINION, LIKES/DISLIKES, AGREE/DISAGREE)
            expressions: [
                // Giving Opinion
                { title: "Expression: Opinion", content: "In my opinion / In my view...", hint: "Use this to state your point of view clearly." },
                { title: "Expression: Opinion", content: "As far as I'm concerned...", hint: "Use this to introduce your strong personal perspective." },
                { title: "Expression: Opinion", content: "From my perspective...", hint: "Frame your thoughts from your personal viewpoint." },
                
                // Likes & Dislikes
                { title: "Expression: Likes & Dislikes", content: "I'm really keen on / I'm fond of...", hint: "Express something you really enjoy doing." },
                { title: "Expression: Likes & Dislikes", content: "I can't stand / I'm not a big fan of...", hint: "Express strong dislike for a habit or activity." },
                { title: "Expression: Likes & Dislikes", content: "I'd much rather...", hint: "Express a preference for one thing over another." },

                // Agreement & Disagreement
                { title: "Expression: Agree / Disagree", content: "I couldn't agree more!", hint: "Express total agreement with an idea or statement." },
                { title: "Expression: Agree / Disagree", content: "I see your point, but...", hint: "Politely disagree or offer a counter-perspective." },
                { title: "Expression: Agree / Disagree", content: "That's a valid point, however...", hint: "Acknowledge an idea before presenting your own argument." }
            ],

            // MODAL VERBS BY CATEGORY
            modalAbility: [
                { categoryKey: "ability", title: "Modal: Ability & Possibility", content: "Can / Could / Be able to", hint: "Talk about a skill or something you manage to do." }
            ],
            modalPermission: [
                { categoryKey: "permission", title: "Modal: Permission & Requests", content: "Could / May / Can", hint: "Formulate a polite request or permission expression." }
            ],
            modalObligation: [
                { categoryKey: "obligation", title: "Modal: Obligation & Necessity", content: "Must / Have to / Need to", hint: "Explain a rule, obligation, or absolute necessity." }
            ],
            modalProhibition: [
                { categoryKey: "prohibition", title: "Modal: Prohibition vs Optional", content: "Mustn't vs. Don't have to", hint: "Contrast 'strictly forbidden' with 'not necessary'." }
            ],
            modalAdvice: [
                { categoryKey: "advice", title: "Modal: Advice & Recommendation", content: "Should / Ought to / Had better", hint: "Give a recommendation or practical advice." }
            ],
            modalDeduction: [
                { categoryKey: "deduction", title: "Modal: Deduction & Certainty", content: "Must be / Can't be / Might be", hint: "Make a speculation or logical deduction about a situation." }
            ],

            // TOPICS (SOLICITADOS)
            topics: [
                { title: "Speaking Topic", content: "Travel Plans", hint: "Discuss destination ideas, upcoming trips, or dream vacations." },
                { title: "Speaking Topic", content: "Benefits of Working Out Regularly", hint: "Talk about physical and mental health perks of staying active." },
                { title: "Speaking Topic", content: "Benefits vs. Downsides of Self-employment", hint: "Discuss freedom vs. financial risks of working for yourself." },
                { title: "Speaking Topic", content: "Veganism & Plant-based Lifestyle", hint: "Share thoughts on diet choices, ethics, or health trends." }
            ]
        };

        // Sound Synthesizer (Web Audio API)
        let audioCtx = null;

        function getAudioContext() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function playTickSound(frequency = 400) {
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(frequency, ctx.currentTime);
                gain.gain.setValueAtTime(0.08, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.04);
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                osc.start();
                osc.stop(ctx.currentTime + 0.04);
            } catch (e) {}
        }

        function playWarningBeep() {
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, ctx.currentTime);
                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                osc.start();
                osc.stop(ctx.currentTime + 0.12);
            } catch (e) {}
        }

        function playTimesUpAlarm() {
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;

                const osc1 = ctx.createOscillator();
                const gain1 = ctx.createGain();
                osc1.type = 'square';
                osc1.frequency.setValueAtTime(880, now);
                gain1.gain.setValueAtTime(0.2, now);
                gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc1.connect(gain1);
                gain1.connect(ctx.destination);
                osc1.start(now);
                osc1.stop(now + 0.15);

                const osc2 = ctx.createOscillator();
                const gain2 = ctx.createGain();
                osc2.type = 'square';
                osc2.frequency.setValueAtTime(1100, now + 0.18);
                gain2.gain.setValueAtTime(0.25, now + 0.18);
                gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                osc2.connect(gain2);
                gain2.connect(ctx.destination);
                osc2.start(now + 0.18);
                osc2.stop(now + 0.35);
            } catch (e) {}
        }

        let timerInterval = null;

        function getRandomItem(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function getModalPool(filterValue) {
            if (filterValue === 'none') return null;

            const allModals = [
                ...dataPool.modalAbility,
                ...dataPool.modalPermission,
                ...dataPool.modalObligation,
                ...dataPool.modalProhibition,
                ...dataPool.modalAdvice,
                ...dataPool.modalDeduction
            ];

            if (filterValue === 'ability') return dataPool.modalAbility;
            if (filterValue === 'permission') return dataPool.modalPermission;
            if (filterValue === 'obligation') return dataPool.modalObligation;
            if (filterValue === 'prohibition') return dataPool.modalProhibition;
            if (filterValue === 'advice') return dataPool.modalAdvice;
            if (filterValue === 'deduction') return dataPool.modalDeduction;

            return allModals;
        }

        function startRoulette() {
            const startBtn = document.getElementById('start-btn');
            const difficulty = document.getElementById('difficulty').value;
            const modalFilter = document.getElementById('modal-filter').value;
            const board = document.getElementById('game-board');
            const timerBox = document.getElementById('timer-box');

            // Reset Timer
            if (timerInterval) clearInterval(timerInterval);
            timerBox.style.display = 'none';
            timerBox.classList.remove('warning');

            startBtn.disabled = true;

            const modalPool = getModalPool(modalFilter);
            let categories = [];

            if (modalFilter === 'none') {
                // SEM MODALS
                if (difficulty === 'easy') {
                    // 3 Cards: 1 Tense + 1 Expression + 1 Topic
                    categories = [dataPool.tenses, dataPool.expressions, dataPool.topics];
                } else if (difficulty === 'medium') {
                    // 4 Cards: 2 Tenses + 1 Expression + 1 Topic
                    categories = [dataPool.tenses, dataPool.tenses, dataPool.expressions, dataPool.topics];
                } else {
                    // Hard: 2 Tenses + 2 Expressions + 1 Topic
                    categories = [dataPool.tenses, dataPool.tenses, dataPool.expressions, dataPool.expressions, dataPool.topics];
                }
            } else {
                // COM MODALS
                if (difficulty === 'easy') {
                    // 3 Cards: 1 Tense + 1 Modal Group + 1 Topic
                    categories = [dataPool.tenses, modalPool, dataPool.topics];
                } else if (difficulty === 'medium') {
                    // 4 Cards: 1 Tense + 1 Modal Group + 1 Expression + 1 Topic
                    categories = [dataPool.tenses, modalPool, dataPool.expressions, dataPool.topics];
                } else {
                    // Hard: 2 Tenses + 1 Modal Group + 1 Expression + 1 Topic
                    categories = [dataPool.tenses, dataPool.tenses, modalPool, dataPool.expressions, dataPool.topics];
                }
            }

            // Create Card DOM layout
            board.innerHTML = '';
            const cardElements = categories.map(pool => {
                const cardEl = document.createElement('div');
                cardEl.className = 'card spinning';
                cardEl.innerHTML = `
                    <div>
                        <div class="card-category">${pool[0].title}</div>
                        <div class="card-content">...</div>
                    </div>
                    <div class="card-hint">Spinning...</div>
                `;
                board.appendChild(cardEl);
                return { element: cardEl, pool: pool, finalItem: getRandomItem(pool) };
            });

            // Roulette Slowdown Effect
            let step = 0;
            const totalSteps = 25;

            function spinStep() {
                step++;
                cardElements.forEach(item => {
                    const randomTemp = getRandomItem(item.pool);
                    item.element.querySelector('.card-content').innerText = randomTemp.content;
                    item.element.querySelector('.card-hint').innerText = "💡 " + randomTemp.hint;
                });

                playTickSound(350 + step * 10);

                if (step < totalSteps) {
                    const delay = 50 + Math.pow(step, 1.8);
                    setTimeout(spinStep, delay);
                } else {
                    // Final Stop
                    cardElements.forEach(item => {
                        item.element.classList.remove('spinning');
                        item.element.querySelector('.card-content').innerText = item.finalItem.content;
                        item.element.querySelector('.card-hint').innerText = "💡 " + item.finalItem.hint;
                    });

                    playTickSound(800);
                    startBtn.disabled = false;

                    initTimer();
                    saveToFirestore(difficulty, modalFilter, cardElements.map(i => i.finalItem.content));
                }
            }

            spinStep();
        }

        function initTimer() {
            const timerSetting = document.getElementById('timer-setting').value;
            const timerBox = document.getElementById('timer-box');
            const timerText = document.getElementById('timer-text');

            if (timerSetting === 'off') return;

            let timeLeft = parseInt(timerSetting);
            timerBox.style.display = 'flex';
            timerText.innerText = `Time Remaining: ${timeLeft}s`;

            timerInterval = setInterval(() => {
                timeLeft--;
                timerText.innerText = `Time Remaining: ${timeLeft}s`;

                if (timeLeft <= 10 && timeLeft > 0) {
                    timerBox.classList.add('warning');
                }

                if (timeLeft <= 3 && timeLeft > 0) {
                    playWarningBeep();
                }

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    timerText.innerText = "⏱️ Time's Up!";
                    playTimesUpAlarm();
                    setTimeout(() => {
                        alert("Time's up! Great job. Check if you included the required tenses, expressions, and topic ideas!");
                    }, 50);
                }
            }, 1000);
        }

        async function saveToFirestore(difficulty, modalFilter, cardsDrawn) {
            try {
                if (window.dbRef && window.addDoc) {
                    await window.addDoc(window.collection(window.dbRef, "grammar_review_sessions"), {
                        difficulty: difficulty,
                        modalFilter: modalFilter,
                        cardsDrawn: cardsDrawn,
                        timestamp: window.serverTimestamp()
                    });
                }
            } catch (e) {}
        }
    </script>
</body>
</html>
